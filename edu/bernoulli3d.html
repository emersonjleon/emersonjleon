<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador 3D con Three.js - Coeficientes del Trinomio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        #controls-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            max-width: 320px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #4CAF50;
        }
        .control-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 13px;
            margin-bottom: 4px;
        }
        input {
            padding: 6px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 400px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="controls-panel">
        <h2>Parámetros $(ax + by + cz)^n$</h2>
        <div class="control-group">
            <label for="n-val">Grado (n) [Máx recomendado: 15]:</label>
            <input type="number" id="n-val" value="6" min="1" max="20">
        </div>
        <div class="control-group">
            <label for="a-val">Coeficiente (a):</label>
            <input type="number" id="a-val" value="1" step="0.1">
        </div>
        <div class="control-group">
            <label for="b-val">Coeficiente (b):</label>
            <input type="number" id="b-val" value="1" step="0.1">
        </div>
        <div class="control-group">
            <label for="c-val">Coeficiente (c):</label>
            <input type="number" id="c-val" value="1" step="0.1">
        </div>
        <button id="generate-btn">Generar Gráfica 3D</button>
    </div>

    <div id="info">
        Usa el <strong>clic izquierdo + arrastrar</strong> para rotar la cámara.<br>
        Usa la <strong>rueda del ratón</strong> para hacer zoom.<br>
        Las barras prismáticas tienen bases formadas por <strong>triángulos equiláteros</strong>.
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let barsGroup;

        function init() {
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 20, 25);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controles de órbita
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 40, 20);
            scene.add(directionalLight);

            // Grupo para las barras
            barsGroup = new THREE.Group();
            scene.add(barsGroup);

            // Escuchar eventos de cambio de tamaño de ventana
            window.addEventListener('resize', onWindowResize);

            // Evento del botón
            document.getElementById('generate-btn').addEventListener('click', construirBarrasTrinomias);

            // Generación inicial
            construirBarrasTrinomias();

            // Loop de animación
            animate();
        }

        function factorial(num) {
            if (num < 0) return 0;
            if (num === 0 || num === 1) return 1;
            let result = 1;
            for (let i = 2; i <= num; i++) {
                result *= i;
            }
            return result;
        }

        function multinomial(n, j, k) {
            let rem = n - j - k;
            if (rem < 0) return 0;
            return factorial(n) / (factorial(j) * factorial(k) * factorial(rem));
        }

        // Función para crear una geometría de barra con base de triángulo equilátero extruido en altura (Y)
        function crearPrismaTriangular(ladoBase, altura) {
            const geometry = new THREE.BufferGeometry();
            
            const hTriangle = (Math.sqrt(3) / 2) * ladoBase;
            const halfLado = ladoBase / 2;

            // Coordenadas locales para la base inferior (Y = 0) y superior (Y = altura)
            // Centramos el triángulo equilátero en su centroide aproximado para que crezca simétricamente
            const y0 = 0;
            const y1 = altura;

            // Vértices de la base inferior (Triángulo equilátero en el plano XZ)
            const v0 = [-halfLado, y0, -hTriangle / 3];
            const v1 = [halfLado, y0, -hTriangle / 3];
            const v2 = [0, y0, (2 * hTriangle) / 3];

            // Vértices de la base superior
            const u0 = [-halfLado, y1, -hTriangle / 3];
            const u1 = [halfLado, y1, -hTriangle / 3];
            const u2 = [0, y1, (2 * hTriangle) / 3];

            const vertices = [];
            const normals = [];

            // Función auxiliar para añadir caras triangulares con normales calculadas manualmente o planas
            function addFace(pA, pB, pC) {
                vertices.push(...pA, ...pB, ...pC);
                
                // Calcular normal simple de la cara
                const A = new THREE.Vector3(...pA);
                const B = new THREE.Vector3(...pB);
                const C = new THREE.Vector3(...pC);
                const cb = new THREE.Vector3().subVectors(C, B);
                const ab = new THREE.Vector3().subVectors(A, B);
                cb.cross(ab).normalize();
                
                normals.push(cb.x, cb.y, cb.z);
                normals.push(cb.x, cb.y, cb.z);
                normals.push(cb.x, cb.y, cb.z);
            }

            // Base Inferior (apuntando hacia abajo)
            addFace(v2, v1, v0);
            // Base Superior (apuntando hacia arriba)
            addFace(u0, u1, u2);

            // Caras Laterales (3 rectángulos formados por 2 triángulos cada uno)
            // Lado 0-1
            addFace(v0, v1, u1);
            addFace(v0, u1, u0);

            // Lado 1-2
            addFace(v1, v2, u2);
            addFace(v1, u2, u1);

            // Lado 2-0
            addFace(v2, v0, u0);
            addFace(v2, u0, u2);

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            return geometry;
        }

        function construirBarrasTrinomias() {
            // Limpiar barras anteriores
            while(barsGroup.children.length > 0){ 
                const obj = barsGroup.children[0];
                barsGroup.remove(obj); 
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            const n = parseInt(document.getElementById('n-val').value);
            const a = parseFloat(document.getElementById('a-val').value);
            const b = parseFloat(document.getElementById('b-val').value);
            const c = parseFloat(document.getElementById('c-val').value);

            // Encontrar el valor máximo para escalar la altura de forma óptima
            let maxVal = 0;
            let dataPoints = [];

            for (let j = 0; j <= n; j++) {
                for (let k = 0; k <= (n - j); k++) {
                    let i = n - j - k;
                    let comb = multinomial(n, j, k);
                    let val = comb * Math.pow(a, i) * Math.pow(b, j) * Math.pow(c, k);
                    if (val > 0) {
                        dataPoints.push({j, k, val});
                        if (val > maxVal) maxVal = val;
                    }
                }
            }

            // Parámetros de espaciamiento y tamaño de las celdas en el plano base
            const spacing = 1.0;
            const ladoBase = 0.85; // Lado del triángulo equilátero
            const maxAlturaVisual = 10.0;

            // Desplazamiento para centrar la malla triangular en el origen (0,0,0)
            const offsetX = (n * spacing) / 3;
            const offsetZ = (n * spacing) / 3;

            dataPoints.forEach(pt => {
                let altura = (pt.val / maxVal) * maxAlturaVisual;
                if (altura < 0.1) altura = 0.1; // Altura mínima visible

                // Disposición espacial en una malla triangular isométrica (coordenadas baricéntricas/triangulares)
                // Usamos j para el eje X y k proyectado en diagonal para formar la base triangular de Pascal
                const posX = pt.j * spacing + (pt.k * spacing * 0.5) - offsetX;
                const posZ = pt.k * spacing * (Math.sqrt(3) / 2) - offsetZ;

                const geometry = crearPrismaTriangular(ladoBase, altura);

                // Color dinámico basado en la altura normalizada (mapa de calor estilo Viridis/Flame)
                const colorRatio = pt.val / maxVal;
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.65 - colorRatio * 0.65, 0.9, 0.5),
                    roughness: 0.3,
                    metalness: 0.1,
                    flatShading: true
                });

                const prisma = new THREE.Mesh(geometry, material);
                prisma.position.set(posX, 0, posZ);
                
                barsGroup.add(prisma);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
