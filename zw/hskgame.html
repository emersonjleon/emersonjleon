      <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--background);
            color: var(--primary-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .hanzi {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 4rem;
            text-align: center;
            margin: 1rem 0;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .option {
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option:hover {
            transform: translateY(-2px);
            border-color: var(--secondary-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: var(--secondary-color);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .progress {
            text-align: center;
            margin-bottom: 1rem;
            color: #7f8c8d;
        }

        @media (max-width: 480px) {
            .hanzi {
                font-size: 3rem;
            }
            
            .card {
                padding: 1rem;
            }
        }
   
        /* Add previous styles here */
        .score-container {
            text-align: center;
            margin: 1rem 0;
            font-size: 1.2rem;
        }
        
        .attempts {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .game-over {
            color: #e74c3c;
            text-align: center;
            font-size: 1.5rem;
            margin: 2rem 0;
        }
	.timer {
	    color: #27ae60;
	    font-weight: bold;
	}

	.option-hanzi {
	    font-family: 'Noto Sans SC', sans-serif;
	    font-size: 2rem;
	    margin-bottom: 0.5rem;
	}
	
	.option-pinyin {
	    font-size: 0.9rem;
	    color: #7f8c8d;
	}
    </style>

    const minutes = Math.floor(timeLeft / 60);

    document.getElementById('timer').textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

let currentLesson = [];
let currentQuestionIndex = 0;
let showPinyin = true;
let score = 0;
let attemptsLeft = 3;
let gameActive = true;

// Add at top with other variables
let questionMode = 'chinese'; // 'chinese' or 'spanish'

// New toggle function
function toggleQuestionMode() {
    questionMode = questionMode === 'chinese' ? 'spanish' : 'chinese';
    document.getElementById('modeBtn').textContent = 
        questionMode === 'chinese' ? 'Spanish → Hanzi' : 'Hanzi → Spanish';
    loadQuestion();
}

const VOCABULARY = {
    hsk1: HSK1_FULL,
    hsk2: HSK2_FULL
};
  
function initLesson() {
    const level = document.getElementById('hskLevel').value;
    

    
    // Reset timer
    timeLeft = 120;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
    }, 1000);
    
    const lessonIndex = parseInt(document.getElementById('lessonSelect').value);
    currentLesson =  shuffleArray(VOCABULARY[level][lessonIndex]);
    // currentLesson = shuffleArray([...HSK1_FULL[lessonIndex]]);
    currentQuestionIndex = 0;
    score = 0;
    attemptsLeft = 3;
    gameActive = true;
    document.getElementById('gameOver').textContent = '';
    updateScore();
    loadQuestion();

    updateTimer(); // Initial display
}

function shuffleArray(array) {
    return array.sort(() => Math.random() - 0.5);
}

// Modified loadQuestion function
function loadQuestion() {
    if (!gameActive) return;
    
    const question = currentLesson[currentQuestionIndex];
    const options = questionMode === 'chinese' 
        ? getRandomOptions(question.translation) 
        : getRandomHanziOptions(question.hanzi);

    // Set question display
    if(questionMode === 'chinese') {
        document.getElementById('hanzi').textContent = question.hanzi;
        document.getElementById('pinyin').textContent = showPinyin ? question.pinyin : '';
    } else {
        document.getElementById('hanzi').textContent = question.translation;
        document.getElementById('pinyin').textContent = '';
    }

    // Render options
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = options
        .map(opt => {
            if(questionMode === 'chinese') {
                return `<div class="option" onclick="checkAnswer('${opt}')">${opt}</div>`;
            } else {
                const word = currentLesson.find(w => w.hanzi === opt);
                return `
                    <div class="option" onclick="checkAnswer('${opt}')">
                        <div class="option-hanzi">${opt}</div>
                        ${showPinyin ? `<div class="option-pinyin">${word.pinyin}</div>` : ''}
                    </div>
                `;
            }
        })
        .join('');
}

// New option generator for Hanzi mode
function getRandomHanziOptions(correctHanzi) {
    const allHanzi = currentLesson.map(word => word.hanzi);
    const wrongAnswers = shuffleArray(allHanzi)
        .filter(h => h !== correctHanzi)
        .slice(0, 6);
    
    return shuffleArray([...wrongAnswers, correctHanzi]);
}

function getRandomOptions(correctAnswer) {
    const allTranslations = currentLesson.map(word => word.translation);
    const wrongAnswers = shuffleArray(allTranslations)
        .filter(t => t !== correctAnswer)
        .slice(0, 8);
    
    return shuffleArray([...wrongAnswers, correctAnswer]);
}

function checkAnswer(selected) {
    if (!gameActive) return;

    // Modified checkAnswer function
    const question = currentLesson[currentQuestionIndex];
    const correct = questionMode === 'chinese' 
        ? question.translation 
        : question.hanzi;

    
    // const correct = currentLesson[currentQuestionIndex].translation;
    const options = document.querySelectorAll('.option');
    
    if (selected === correct) {
        score += 10;
        currentQuestionIndex++;
        if (currentQuestionIndex >= currentLesson.length) {
            endGame(true);
            return;
        }
        loadQuestion();
    } else {
	score += -3;
        attemptsLeft--;
        options.forEach(opt => {
            if (opt.textContent === selected) {
                opt.style.borderColor = '#e74c3c';
            }
            if (opt.textContent === correct) {
                opt.style.borderColor = '#2ecc71';
            }
        });
        
        if (attemptsLeft <= 0) {
            endGame(false);
        }
    }
    
    updateScore();
}

function updateScore() {
    document.getElementById('score').textContent = score;
    document.getElementById('attempts').textContent = attemptsLeft;
}


// Modify the endGame function to handle timer
function endGame(success, reason = 'attempts') {
    updateScore();
    clearInterval(timerInterval);
    gameActive = false;
    
    const gameOverDiv = document.getElementById('gameOver');
    
    let message = success 
        ? `🎉 Lesson Complete! Final Score: ${score}`
        : `💀 Game Over! Final Score: ${score} (${reason === 'time' ? 'Time expired' : 'No attempts left'})`;
    
    gameOverDiv.textContent = message;
}
