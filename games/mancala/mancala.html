<!DOCTYPE html>
<html>
<head>
    <title>Mancala</title>
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            width: 800px;
            margin: 20px auto;
            background: #d4a373;
            padding: 20px;
            border-radius: 10px;
        }

        .pit, .store {
            background: #faedcd;
            border: 2px solid #ccd5ae;
            border-radius: 50%;
            height: 60px;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .store {
            height: 100px;
            width: 100px;
        }

        .player-turn {
            text-align: center;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="player-turn" id="turn">Turno: Jugador 1</div>
    <div class="board" id="board"></div>

    <script>
        class Mancala {
            constructor() {
                this.pits = Array(14).fill(4);
                this.pits[6] = this.pits[13] = 0; // Almacenes
                this.currentPlayer = 1;
                this.gameOver = false;
                
                this.renderBoard();
            }

            renderBoard() {
                const board = document.getElementById('board');
                board.innerHTML = '';

                // Almacén Jugador 2
                this.createStore(this.pits[13], 2);

                // Filas de hoyos
                for (let i = 12; i >= 7; i--) {
                    this.createPit(i, 2);
                }

                // Almacén Jugador 1
                this.createStore(this.pits[6], 1);

                for (let i = 0; i < 6; i++) {
                    this.createPit(i, 1);
                }

                document.getElementById('turn').textContent = 
                    `Turno: Jugador ${this.currentPlayer}`;
            }

            createPit(index, player) {
                const pit = document.createElement('div');
                pit.className = 'pit';
                pit.textContent = this.pits[index];
                if (this.currentPlayer === player && !this.gameOver) {
                    pit.addEventListener('click', () => this.move(index));
                }
                this.colorPit(pit, player);
                board.appendChild(pit);
            }

            createStore(seeds, player) {
                const store = document.createElement('div');
                store.className = 'store';
                store.textContent = seeds;
                this.colorPit(store, player);
                board.appendChild(store);
            }

            colorPit(element, player) {
                element.style.backgroundColor = player === 1 ? '#e9edc9' : '#fefae0';
            }

            move(pitIndex) {
                if (this.gameOver || 
                    (this.currentPlayer === 1 && pitIndex > 6) || 
                    (this.currentPlayer === 2 && pitIndex < 7)) return;

                let seeds = this.pits[pitIndex];
                this.pits[pitIndex] = 0;
                let currentIndex = pitIndex;

                while (seeds > 0) {
                    currentIndex = (currentIndex + 1) % 14;
                    if ((this.currentPlayer === 1 && currentIndex === 13) || 
                        (this.currentPlayer === 2 && currentIndex === 6)) continue;
                    
                    this.pits[currentIndex]++;
                    seeds--;
                }

                // Capturar semillas
                if (this.pits[currentIndex] === 1 && 
                    ((this.currentPlayer === 1 && currentIndex < 6) || 
                     (this.currentPlayer === 2 && currentIndex > 6 && currentIndex < 13))) {
                    const oppositeIndex = 12 - currentIndex;
                    this.pits[this.currentPlayer === 1 ? 6 : 13] += this.pits[oppositeIndex] + 1;
                    this.pits[currentIndex] = 0;
                    this.pits[oppositeIndex] = 0;
                }

                // Verificar turno extra
                if ((this.currentPlayer === 1 && currentIndex === 6) || 
                    (this.currentPlayer === 2 && currentIndex === 13)) {
                    this.renderBoard();
                    return;
                }

                // Cambiar jugador
                this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
                this.checkGameOver();
                this.renderBoard();
            }

            checkGameOver() {
                const player1Pits = this.pits.slice(0, 6).every(pit => pit === 0);
                const player2Pits = this.pits.slice(7, 13).every(pit => pit === 0);
                
                if (player1Pits || player2Pits) {
                    this.gameOver = true;
                    this.pits[6] += this.pits.slice(7, 13).reduce((a, b) => a + b, 0);
                    this.pits[13] += this.pits.slice(0, 6).reduce((a, b) => a + b, 0);
                    this.pits = this.pits.map((_, i) => (i === 6 || i === 13) ? this.pits[i] : 0);
                    this.renderBoard();
                    alert(`Juego terminado! Puntuación:\nJugador 1: ${this.pits[6]}\nJugador 2: ${this.pits[13]}`);
                }
            }
        }

        // Iniciar juego
        const game = new Mancala();
    </script>
</body>
</html>
