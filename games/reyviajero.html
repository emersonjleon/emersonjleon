<!DOCTYPE html>
<html>
<head>
    <title>El rey viajero</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0d9b5;
            font-family: Arial, sans-serif;
        }

        .title {
            font-size: 2.5em;
            color: #6b4226;
            margin: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .board {
            display: grid;
            gap: 1px;
            background: #000;
            padding: 5px;
            border: 3px solid #6b4226;
            border-radius: 5px;
            margin: 20px 0;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #b58863;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .cell.light { background: #f0d9b5; }
        .valid-move { background: rgba(0, 255, 0, 0.3) !important; }
        
        .queen {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2d1a0f;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .queen.p2 { background: #e6d8c8; }

        .controls {
            margin: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            background: #6b4226;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .banner {
            font-size: 1.2em;
            padding: 10px 30px;
            background: #6b4226;
            color: white;
            border-radius: 5px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1 class="title">El rey viajero</h1>
    <div class="controls">
        <input type="number" id="rows" value="8" min="1" style="width: 60px;">
        <input type="number" id="cols" value="8" min="1" style="width: 60px;">
        <button onclick="initGame()">Nuevo Juego</button>
        <button onclick="toggleWinCondition()" id="winCondition">Gana al llegar</button>
        <button onclick="toggleAuto(1)" id="auto1">Auto J1</button>
        <button onclick="toggleAuto(2)" id="auto2">Auto J2</button>
    </div>
    <div class="banner" id="status">Jugador 1 inicia</div>
    <div class="board" id="board"></div>

    <script>
        let game = {
            rows: 8,
            cols: 8,
            queenPos: [0, 0],
            currentPlayer: 1,
            auto: { 1: false, 2: false },
            winOnTarget: true,
            gameOver: false
        };

        function initGame() {
            game.rows = parseInt(document.getElementById('rows').value);
            game.cols = parseInt(document.getElementById('cols').value);
            game.queenPos = [0, 0];
            game.currentPlayer = 1;
            game.gameOver = false;
            
            renderBoard();
            updateStatus();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${game.cols}, 40px)`;
            board.innerHTML = '';
            
            for(let i = 0; i < game.rows; i++) {
                for(let j = 0; j < game.cols; j++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(i + j) % 2 ? 'light' : ''}`;
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    if(i === game.queenPos[0] && j === game.queenPos[1]) {
                        const queen = document.createElement('div');
                        queen.className = `queen p${game.currentPlayer}`;
                        cell.appendChild(queen);
                    }
                    
                    if(!game.gameOver) {
                        const validMoves = getValidMoves();
                        if(validMoves.some(([r, c]) => r === i && c === j)) {
                            cell.classList.add('valid-move');
                            cell.addEventListener('click', () => moveQueen(i, j));
                        }
                    }
                    
                    board.appendChild(cell);
                }
            }
        }

        function getValidMoves() {
            const [x, y] = game.queenPos;
            const moves = [];
            
            // Movimientos posibles
            if(x < game.rows - 1) moves.push([x + 1, y]); // Abajo
            if(y < game.cols - 1) moves.push([x, y + 1]); // Derecha
            if(x < game.rows - 1 && y < game.cols - 1) moves.push([x + 1, y + 1]); // Diagonal
            
            return moves;
        }

        function moveQueen(newX, newY) {
            if(game.gameOver) return;
            
            game.queenPos = [newX, newY];
	    
            
            // Verificar condición de victoria/derrota
            if(newX === game.rows - 1 && newY === game.cols - 1) {
                game.gameOver = true;
                const winner = game.winOnTarget ? game.currentPlayer : 3 - game.currentPlayer;
		game.currentPlayer = 3 - game.currentPlayer;
                updateStatus(`Jugador ${winner} gana!`);
            } else {
                game.currentPlayer = 3 - game.currentPlayer;
                updateStatus();
                
                if(game.auto[game.currentPlayer]) {
                    setTimeout(autoMove, 500);
                }
            }
            
            renderBoard();
        }

        function autoMove() {
            if(game.gameOver || !game.auto[game.currentPlayer]) return;
            
            const validMoves = getValidMoves();
            if(validMoves.length > 0) {
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                moveQueen(...randomMove);
            }
        }

        function toggleAuto(player) {
            game.auto[player] = !game.auto[player];
            document.getElementById(`auto${player}`).style.background = 
                game.auto[player] ? '#4CAF50' : '#6b4226';
            
            if(game.auto[player] && !game.gameOver) autoMove();
        }

        function toggleWinCondition() {
            game.winOnTarget = !game.winOnTarget;
            document.getElementById('winCondition').textContent = 
                game.winOnTarget ? 'Gana al llegar' : 'Pierde al llegar';
        }

        function updateStatus(status=false) {
            if(status) {
                document.getElementById('status').textContent=status;
            } else {
		let status = `Turno del Jugador ${game.currentPlayer}`;
		document.getElementById('status').textContent = status;
	    }
        }

        // Iniciar el juego
        initGame();
    </script>
</body>
</html>
