<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Racionales Interactivos</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: grab;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const margin = 50;
    let width = canvas.width;
    let height = canvas.height;

    // Escala inicial y nivel de zoom
    let xScale = d3.scaleLinear().domain([-1, 1]).range([margin, width - margin]);
    let zoomLevel = 1;

    // Generar racionales dentro del rango visible
    function generateRationalNumbers(range, maxDenominator) {
        const rationals = [];
        for (let d = 1; d <= maxDenominator; d++) {
            for (let n = Math.ceil(-range * d); n <= Math.floor(range * d); n++) {
                rationals.push({ numerator: n, denominator: d, value: n / d });
            }
        }
        return rationals;
    }

    // Dibujar recta numérica y puntos
    function draw(rationals) {
        ctx.clearRect(0, 0, width, height);

        // Dibujar la recta
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(margin, height / 2);
        ctx.lineTo(width - margin, height / 2);
        ctx.stroke();

        // Dibujar puntos
        rationals.forEach(({ numerator, denominator, value }) => {
            const x = xScale(value);
            const y = height / 2;

            if (denominator <= maxDenominator / 2) {
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = "black";
                ctx.font = "12px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`${numerator}/${denominator}`, x, y - 10);
            } else {
                ctx.fillStyle = "gray";
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fill();
            }
        });
    }

    // Manejo de zoom y actualización dinámica
    const zoom = d3.zoom()
        .scaleExtent([0.01, Infinity]) // Permitir zoom infinito
        .on("zoom", (event) => {
            const transform = event.transform;
            xScale = transform.rescaleX(d3.scaleLinear().domain([-10, 10]).range([margin, width - margin]));
            zoomLevel = transform.k;

            // Calcular el rango visible y ajustar maxDenominator dinámicamente
            const visibleRange = Math.abs(xScale.invert(width - margin) - xScale.invert(margin));
            maxDenominator = Math.min(Math.ceil(200 * zoomLevel), 10000); // Ajuste dinámico con un límite superior

            // Generar y filtrar racionales dentro del intervalo visible
            const filteredRationals = generateRationalNumbers(visibleRange / 2, maxDenominator)
                .filter(r => {
                    const value = r.value;
                    return value >= xScale.invert(margin) && value <= xScale.invert(width - margin);
                });

            draw(filteredRationals);
        });

    // Inicializar con los números racionales visibles
    let maxDenominator = 20; // Denominador máximo inicial
    const visibleRange = Math.abs(xScale.invert(width - margin) - xScale.invert(margin));
    const initialRationals = generateRationalNumbers(visibleRange / 2, maxDenominator)
        .filter(r => {
            const value = r.value;
            return value >= xScale.invert(margin) && value <= xScale.invert(width - margin);
        });

    draw(initialRationals);
    d3.select(canvas).call(zoom);

    // Ajustar tamaño del canvas al cambiar el tamaño de la ventana
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        width = canvas.width;
        height = canvas.height;

        xScale.range([margin, width - margin]);

        const visibleRange = Math.abs(xScale.invert(width - margin) - xScale.invert(margin));
        maxDenominator = Math.min(Math.ceil(200 * zoomLevel), 10000);

        const filteredRationals = generateRationalNumbers(visibleRange / 2, maxDenominator)
            .filter(r => {
                const value = r.value;
                return value >= xScale.invert(margin) && value <= xScale.invert(width - margin);
            });

        draw(filteredRationals);
    });
</script>
</body>
</html>
