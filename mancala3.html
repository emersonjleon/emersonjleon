<!DOCTYPE html>
<html>
<head>
    <title>Mancala - Versión Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Bubblegum Sans', cursive;
            background: #f0d9b5;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .title {
            font-size: 3em;
            color: #8b4513;
            text-shadow: 2px 2px #ffd700;
            margin: 20px 0;
        }

        .board-container {
            position: relative;
            width: 900px;
            margin: 100px auto;
        }

        .board {
            display: grid;
            grid-template-columns: 100px repeat(6, 1fr) 100px;
            grid-template-rows: auto auto;
            gap: 10px;
            background: #6b4226;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .store {
            background: #deb887;
            border: 5px solid #8b4513;
            border-radius: 50px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #store-player1 {
            grid-column: 1;
            grid-row: 1 / 3;
        }

        #store-player2 {
            grid-column: 8;
            grid-row: 1 / 3;
        }

        .pits-row {
            display: contents;
        }

        .pit {
            background: #deb887;
            border: 3px solid #8b4513;
            border-radius: 50%;
            height: 80px;
            width: 80px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .pit:hover {
            transform: scale(1.1);
        }

        .player1 .pit {
            border-color: #2e7d32 !important;
        }

        .player2 .pit {
            border-color: #d84315 !important;
        }

        .stone {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid #5d4037;
            border-radius: 50%;
            position: absolute;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .count-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
            z-index: 1;
            pointer-events: none;
        }

        .controls {
            margin: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background: #8b4513;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }

        .turn-indicator {
            position: absolute;
            font-size: 24px;
            padding: 10px 30px;
            border-radius: 25px;
            width: max-content;
            left: 50%;
            transform: translateX(-50%);
        }

        #turn-player1 {
            bottom: -70px;
            background: #2e7d3255;
            color: #2e7d32;
        }

        #turn-player2 {
            top: -70px;
            background: #d8431555;
            color: #d84315;
        }
    </style>
</head>
<body>
    <h1 class="title">MANCALA</h1>
    
    <div class="board-container">
        <div class="turn-indicator" id="turn-player2">Turno del Jugador 2</div>
        <div class="board" id="board"></div>
        <div class="turn-indicator" id="turn-player1">Turno del Jugador 1</div>
    </div>
    
    <div class="controls">
        <button onclick="game.newGame()">Nuevo Juego</button>
        <button onclick="game.toggleNumbers()">Mostrar/Ocultar Números</button>
        <button onclick="document.body.classList.toggle('show-rules')">Mostrar Reglas</button>
    </div>

    <script>
        class Mancala {
            constructor() {
                this.showNumbers = true;
                this.previousPits = [];
                this.init();
            }

            init() {
                this.pits = Array(14).fill(4);
                this.pits[6] = this.pits[13] = 0;
                this.currentPlayer = 1;
                this.gameOver = false;
                this.render();
            }

            render() {
                const board = document.getElementById('board');
                board.innerHTML = '';
                
                // Almacenes
                this.createStore(6, 1);
                this.createStore(13, 2);

                // Hoyos Jugador 2 (fila superior)
                const topRow = document.createElement('div');
                topRow.className = 'pits-row';
                for (let i = 12; i >= 7; i--) {
                    this.createPit(i, 2, topRow);
                }
                board.appendChild(topRow);

                // Hoyos Jugador 1 (fila inferior)
                const bottomRow = document.createElement('div');
                bottomRow.className = 'pits-row';
                for (let i = 0; i < 6; i++) {
                    this.createPit(i, 1, bottomRow);
                }
                board.appendChild(bottomRow);

                // Actualizar indicadores
                document.getElementById('turn-player1').style.display = this.currentPlayer === 1 ? 'block' : 'none';
                document.getElementById('turn-player2').style.display = this.currentPlayer === 2 ? 'block' : 'none';
                
                this.previousPits = [...this.pits];
            }

            createPit(index, player, container) {
                const pit = document.createElement('div');
                pit.className = `pit player${player}`;
                
                // Actualizar solo si cambió el número
                if (this.pits[index] !== this.previousPits[index]) {
                    pit.innerHTML = '';
                    for (let i = 0; i < this.pits[index]; i++) {
                        const stone = document.createElement('div');
                        stone.className = 'stone';
                        stone.style.left = `${Math.random() * 70 + 15}%`;
                        stone.style.top = `${Math.random() * 70 + 15}%`;
                        pit.appendChild(stone);
                    }
                }

                if (this.showNumbers) {
                    const count = document.createElement('div');
                    count.className = 'count-number';
                    count.textContent = this.pits[index];
                    pit.appendChild(count);
                }

                if (!this.gameOver && 
                   ((this.currentPlayer === 1 && index < 6) || 
                    (this.currentPlayer === 2 && index > 6 && index < 13))) {
                    pit.addEventListener('click', () => this.move(index));
                }
                
                container.appendChild(pit);
            }

            createStore(index, player) {
                const store = document.createElement('div');
                store.className = `store`;
                store.id = `store-player${player}`;
                
                // Actualizar solo si cambió el número
                if (this.pits[index] !== this.previousPits[index]) {
                    store.innerHTML = '';
                    for (let i = 0; i < this.pits[index]; i++) {
                        const stone = document.createElement('div');
                        stone.className = 'stone';
                        stone.style.width = '25px';
                        stone.style.height = '25px';
                        stone.style.left = `${Math.random() * 70 + 15}%`;
                        stone.style.top = `${Math.random() * 70 + 15}%`;
                        store.appendChild(stone);
                    }
                }

                if (this.showNumbers) {
                    const count = document.createElement('div');
                    count.className = 'count-number';
                    count.style.fontSize = '40px';
                    count.textContent = this.pits[index];
                    store.appendChild(count);
                }

                board.appendChild(store);
            }

            move(pitIndex) {
                if (this.gameOver) return;

                let seeds = this.pits[pitIndex];
                if (seeds === 0) return;

                this.pits[pitIndex] = 0;
                let currentIndex = pitIndex;

                while (seeds > 0) {
                    currentIndex = (currentIndex + 1) % 14;
                    if ((this.currentPlayer === 1 && currentIndex === 13) || 
                        (this.currentPlayer === 2 && currentIndex === 6)) continue;
                    
                    this.pits[currentIndex]++;
                    seeds--;
                }

                if (this.pits[currentIndex] === 1 && 
                    ((this.currentPlayer === 1 && currentIndex < 6) || 
                     (this.currentPlayer === 2 && currentIndex > 6 && currentIndex < 13))) {
                    const oppositeIndex = 12 - currentIndex;
                    this.pits[this.currentPlayer === 1 ? 6 : 13] += this.pits[oppositeIndex] + 1;
                    this.pits[currentIndex] = 0;
                    this.pits[oppositeIndex] = 0;
                }

                if ((this.currentPlayer === 1 && currentIndex === 6) || 
                    (this.currentPlayer === 2 && currentIndex === 13)) {
                    this.render();
                    return;
                }

                this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
                this.checkGameOver();
                this.render();
            }

            checkGameOver() {
                const player1Empty = this.pits.slice(0, 6).every(p => p === 0);
                const player2Empty = this.pits.slice(7, 13).every(p => p === 0);
                
                if (player1Empty || player2Empty) {
                    this.gameOver = true;
                    this.pits[6] += this.pits.slice(7, 13).reduce((a, b) => a + b, 0);
                    this.pits[13] += this.pits.slice(0, 6).reduce((a, b) => a + b, 0);
                    this.pits = this.pits.map((_, i) => (i === 6 || i === 13) ? this.pits[i] : 0);
                    this.render();
                    setTimeout(() => {
                        alert(`¡Juego Terminado!\nPuntuación:\nJugador 1: ${this.pits[6]}\nJugador 2: ${this.pits[13]}`);
                    }, 100);
                }
            }

            newGame() {
                this.init();
            }

            toggleNumbers() {
                this.showNumbers = !this.showNumbers;
                this.render();
            }
        }

        const game = new Mancala();
    </script>
</body>
</html>
